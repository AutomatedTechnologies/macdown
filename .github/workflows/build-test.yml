name: MacDown V-4 build proof

on:
  push:
    branches: [build-test-macdown]
  workflow_dispatch:
    inputs:
      build_tag:
        description: "Explicit build tag (SDS-10 tranche pattern, cf. Distro version_override). Required for a publishing run: the tag is the next sequential registry tag, NOT the Actions run number — run #12 was a cancelled duplicate, so run_number no longer equals the tag sequence."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve build tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.build_tag }}" ]; then
            TAG="${{ inputs.build_tag }}"
          else
            TAG="macdown-test-${{ github.run_number }}"
          fi
          echo "BUILD_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Resolved BUILD_TAG=$TAG (event ${{ github.event_name }}, run ${{ github.run_number }})"

      - name: Report Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          xcodebuild -showsdks

      - name: List schemes (sanity)
        run: |
          xcodebuild -workspace MacDown.xcworkspace -list

      - name: Generate generated parser sources (pmh_parser.c, handlebars tab/yy)
        run: |
          make -C Dependency/peg-markdown-highlight
          test -s Dependency/peg-markdown-highlight/pmh_parser.c
          cd Dependency/handlebars-objc/src/handlebars-objc/parser
          bison -d -b y handlebars-objc.ym
          ls -la
          TAB_C=$(ls *.tab.c* | head -n 1)
          test -n "$TAB_C"
          mv "$TAB_C" handlebars-objc.tab.m
          if [ ! -s y.tab.h ]; then TAB_H=$(ls *.tab.h* | head -n 1); test -n "$TAB_H"; cp "$TAB_H" y.tab.h; fi
          flex -o handlebars-objc.yy.m handlebars-objc.lm
          test -s handlebars-objc.tab.m
          test -s handlebars-objc.yy.m
          test -s y.tab.h

      - name: Build MacDown (Release, unsigned, 10.13 floor)
        run: |
          set -o pipefail
          xcodebuild -workspace MacDown.xcworkspace -scheme MacDown \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            ARCHS=x86_64 \
            CURRENT_PROJECT_VERSION="$BUILD_TAG" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload full xcodebuild log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn

      - name: Package app as zip
        if: success()
        run: |
          APP=$(find ./DerivedData -name 'MacDown.app' -path '*Release*' | grep -v '\.dSYM' | head -1)
          echo "Built app: $APP"
          test -n "$APP"
          test -x "$APP/Contents/MacOS/MacDown"
          file "$APP/Contents/MacOS/MacDown"
          ditto -c -k --keepParent "$APP" MacDown-test.zip
          ls -la MacDown-test.zip
          shasum -a 256 MacDown-test.zip

      - name: Upload test build zip (survival copy)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macdown-test-zip
          path: MacDown-test.zip

      # Publishing is dispatch-only (2026-11-10, SDS10-T3): a push
      # run is a build proof and must never publish, because its
      # run-number tag no longer matches the registry's sequential
      # tag (run #12 was a cancelled duplicate of the test-11 run).
      - name: Publish prerelease with test build
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$BUILD_TAG" MacDown-test.zip \
            --prerelease \
            --title "MacDown — Academy build $BUILD_TAG (MD-T5 handler rank)" \
            --notes "Academy build $BUILD_TAG of MacDown (tranche MD-T5, Distro files/24). One change from macdown-test-12: the Markdown document type now declares LSHandlerRank Alternate — MacDown presents itself as an alternate handler for markdown, deliberately not the system default and not the owner; routing from Muse (Academy Build) opens files in MacDown explicitly, and any system-default change is the owner's consented act in Muse, never something MacDown claims by installing. Everything else stands from test-12: Academy bundle ID com.detroitautomationacademy.macdown, Academy audit entry, SDS-10 conformance entry, SDS-8 welcome screen (MPWelcomeController), bundled Academy license and notice files. Lineage: F-02 Hoedown nesting-bound fix + F-10 toolbar guard + U1 updater repoint + F-05 V-1..V-3 vendoring (CocoaPods removed). NOT rig-verified on High Sierra. Findings F-01/F-02/F-03/F-05/F-06 remain OPEN. NOT A RELEASE."
